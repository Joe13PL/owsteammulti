[OWSteamNet]
; 1 = multiplayer over Steam on, 0 = proxy is fully passive
Enabled=1
; public | friends | off  - how a hosted server is advertised on Steam
Lobby=public
; servers of Steam friends playing Original War show up in the LAN list
DiscoverFriends=1
; servers advertised in public Steam lobbies show up in the LAN list
DiscoverLobbies=1
; accept incoming Steam connections only while hosting
AcceptOnlyWhenHosting=1
; first octet of virtual IPs - keep 10 (the game treats 10.x as LAN)
FakeNetOctet=10
Log=1

[SyncFix]
; desync fixes for OwarOGL_SGUI.exe (all players should use them)
Enabled=1
; random streams no longer share Delphi's global RandSeed (thread race)
RngIsolation=1
; restore the FPU control word before every game tick (logged when it was wrong)
FpuGuard=1
; drawing no longer consumes the CRC-checked animation random stream
DrawRngFix=1
; don't fire the local-only ActiveUnitChanged script event in multiplayer
SelectEventMP=1
