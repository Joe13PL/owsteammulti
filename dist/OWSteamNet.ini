[OWSteamNet]
; 1 = multiplayer over Steam on, 0 = proxy is fully passive
Enabled=1
; public | friends | off  - how a hosted server is advertised on Steam
Lobby=public
; servers of Steam friends playing Original War show up in the LAN list
DiscoverFriends=1
; servers advertised in public Steam lobbies show up in the LAN list
DiscoverLobbies=1
; accept incoming Steam connections only while hosting
AcceptOnlyWhenHosting=1
; first octet of virtual IPs - keep 10 (the game treats 10.x as LAN)
FakeNetOctet=10
Log=1

